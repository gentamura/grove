[package]
name = "grove"
version = "0.2.0"
description = "A native GPUI viewer for local Claude Code sessions"
edition = "2024"
license = "MIT"

[dependencies]
chrono = { version = "0.4.45", features = ["serde"] }
dirs = "6.0.0"
gpui = { version = "=0.2.2", default-features = false, features = ["font-kit"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.19"
unicode-segmentation = "1.13.3"
walkdir = "2.5.0"

[dev-dependencies]
tempfile = "3.27.0"

[profile.dev.package]
gpui = { opt-level = 3 }
taffy = { opt-level = 3 }
resvg = { opt-level = 3 }
usvg = { opt-level = 3 }

[profile.release]
lto = "thin"
strip = true
